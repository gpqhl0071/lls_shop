<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>发生错误</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- 引入自定义CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="error-container mb-5">
                    <i class="fas fa-bug fa-5x text-warning mb-4"></i>
                    <h1 class="mb-4">发生错误</h1>
                    <p class="lead mb-5">很抱歉，在处理您的请求时发生了错误。请稍后再试或联系我们的支持团队。</p>
                    <div class="d-flex justify-content-center">
                        <a href="/" class="btn btn-primary me-3">
                            <i class="fas fa-home me-2"></i>返回首页
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>返回上一页
                        </button>
                        <button onclick="location.reload()" class="btn btn-outline-success ms-3">
                            <i class="fas fa-sync-alt me-2"></i>刷新页面
                        </button>
                    </div>
                </div>
                
                <div class="support-info mt-5">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            <h5 class="mb-0">需要帮助？</h5>
                        </div>
                        <div class="card-body">
                            <p class="card-text">如果您继续遇到问题，请联系我们的客户支持团队。</p>
                            <div class="d-flex justify-content-center gap-3">
                                <a href="mailto:support@example.com" class="btn btn-outline-primary">
                                    <i class="fas fa-envelope me-2"></i>发送邮件
                                </a>
                                <a href="tel:+123456789" class="btn btn-outline-primary">
                                    <i class="fas fa-phone me-2"></i>联系电话
                                </a>
                                <a href="#" class="btn btn-outline-primary">
                                    <i class="fas fa-comments me-2"></i>在线客服
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 错误信息 -->
                <div class="error-code mt-4" th:if="${status != null}">
                    <p class="text-muted">
                        错误代码: <span th:text="${status}">Unknown</span>
                        <span th:if="${error != null}" th:text="${' - ' + error}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
