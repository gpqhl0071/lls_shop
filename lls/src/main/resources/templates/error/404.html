<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>页面未找到 - 404</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- 引入自定义CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="error-container mb-5">
                    <h1 class="display-1 text-danger mb-4">404</h1>
                    <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                    <h2 class="mb-4">页面未找到</h2>
                    <p class="lead mb-5">很抱歉，您要找的页面不存在或已被移除。</p>
                    <div class="d-flex justify-content-center">
                        <a href="/" class="btn btn-primary me-3">
                            <i class="fas fa-home me-2"></i>返回首页
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>返回上一页
                        </button>
                    </div>
                </div>
                
                <div class="suggestions mt-5">
                    <h4 class="mb-3">您可能想要查看：</h4>
                    <div class="list-group">
                        <a href="/products" class="list-group-item list-group-item-action">
                            <i class="fas fa-list me-2"></i>所有商品列表
                        </a>
                        <a href="/products?status=0" class="list-group-item list-group-item-action">
                            <i class="fas fa-tags me-2"></i>在售商品
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
