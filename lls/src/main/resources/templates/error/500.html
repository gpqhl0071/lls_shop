<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>服务器错误 - 500</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- 引入自定义CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="error-container mb-5">
                    <h1 class="display-1 text-danger mb-4">500</h1>
                    <i class="fas fa-exclamation-circle fa-5x text-danger mb-4"></i>
                    <h2 class="mb-4">服务器内部错误</h2>
                    <p class="lead mb-5">非常抱歉，服务器发生了意外错误。我们的技术团队已经收到通知，并正在修复问题。</p>
                    <div class="d-flex justify-content-center">
                        <a href="/" class="btn btn-primary me-3">
                            <i class="fas fa-home me-2"></i>返回首页
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i>返回上一页
                        </button>
                        <button onclick="location.reload()" class="btn btn-outline-success ms-3">
                            <i class="fas fa-sync-alt me-2"></i>刷新页面
                        </button>
                    </div>
                </div>
                
                <!-- 显示错误信息（仅在开发环境） -->
                <div class="error-details mt-5" th:if="${error != null and @environment.getProperty('spring.profiles.active') == 'dev'}">
                    <div class="card">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0">错误详情</h5>
                        </div>
                        <div class="card-body">
                            <p class="card-text font-monospace text-start" th:text="${error.message}">错误信息</p>
                            <div class="accordion" id="errorAccordion">
                                <div class="accordion-item">
                                    <h2 class="accordion-header" id="stackTraceHeading">
                                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" 
                                                data-bs-target="#stackTraceCollapse" aria-expanded="false" aria-controls="stackTraceCollapse">
                                            查看堆栈跟踪
                                        </button>
                                    </h2>
                                    <div id="stackTraceCollapse" class="accordion-collapse collapse" 
                                         aria-labelledby="stackTraceHeading" data-bs-parent="#errorAccordion">
                                        <div class="accordion-body">
                                            <pre class="text-start"><code th:text="${#strings.replace(#strings.escapeXml(error.getStackTrace() != null ? #strings.arrayJoin(error.getStackTrace(), '\n') : ''), '\t', '    ')}">堆栈跟踪</code></pre>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
